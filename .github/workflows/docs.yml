name: Documentation

on:
  workflow_dispatch:
  release:
    types:
      - published

concurrency:
  group: tomat-website-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jontze/action-mdbook@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          use-linkcheck: false
          use-mermaid: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v6
        with:
          version: "12.9.0"

      - name: Install website tooling
        run: pnpm install --frozen-lockfile

      - name: Build documentation and legacy redirects
        run: pnpm docs:build

      - name: Test hosting and installer
        run: |
          pnpm docs:test
          scripts/test-installer.sh

      - name: Validate Worker deployment
        run: pnpm docs:deploy:check

      - uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: docs/book
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/legacy-pages

  deploy-workers:
    name: Deploy to Cloudflare Workers
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-workers
      url: https://tomat.cc/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v6
        with:
          version: "12.9.0"

      - name: Install website tooling
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: documentation
          path: docs/book

      - name: Deploy Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm docs:deploy

      - name: Verify the live site before redirecting old links
        run: node scripts/docs-verify.mjs

  deploy-pages:
    name: Publish Legacy Redirects
    needs: [build, deploy-workers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - name: Deploy redirects to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
